[workspace]
resolver = "2"
members = ["crates/booya-core", "crates/booya-ai", "crates/booya-cli", "src-tauri"]
default-members = ["crates/booya-core", "crates/booya-ai", "crates/booya-cli", "src-tauri"]

[workspace.package]
rust-version = "1.88"
version = "0.8.0"
edition = "2021"
license = "MIT"
authors = ["Ashish Malla <im45145v@users.noreply.github.com>"]
repository = "https://github.com/im45145v/Booya"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

# Used by CI for test, build and clippy, so all three share one compile of the
# dependencies (and of whisper.cpp) instead of three. Release speed for the
# bench and sync probes, but with debug assertions and overflow checks kept on
# so tests still catch what they catch in a dev build. Installers still use
# `release` (fat LTO), built by release.yml.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = false
debug-assertions = true
overflow-checks = true
