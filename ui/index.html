<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>DemoLens</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <strong>DemoLens</strong>
  <div class="group">
    <select id="rec-target">
      <option value="screen">Full screen</option>
      <option value="window">Window</option>
      <option value="area">Area</option>
    </select>
    <input id="rec-arg" placeholder="window id or x,y,w,h" />
    <label><input type="checkbox" id="rec-mic" checked /> Mic</label>
    <label><input type="checkbox" id="rec-sys" /> System audio</label>
    <button id="rec-btn" class="primary">Record</button>
  </div>
  <div class="group">
    <button id="open-btn" title="Open a video or a .demolens.json project (Ctrl+O)">Open...</button>
    <button id="save-btn" title="Save the project (Ctrl+S)">Save</button>
    <button id="save-as-btn">Save as...</button>
  </div>
  <div class="group">
    <button id="undo-btn" title="Undo (Ctrl+Z)" disabled>Undo</button>
    <button id="redo-btn" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
  </div>
  <span id="project-name"></span>
</header>

<main>
  <section id="stage">
    <div id="preview-wrap"><img id="preview" alt="preview" /><div id="empty">Record or open a video to start.</div></div>
    <div id="transport">
      <button id="play">Play</button>
      <span id="time">0.0 / 0.0 s</span>
      <button id="split">Split</button>
      <button id="del-clip">Delete clip</button>
      <label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option><option>4</option><option>8</option></select></label>
      <button id="add-zoom">Add zoom</button>
      <button id="del-zoom">Delete zoom</button>
      <label>Zoom <input id="zoom-scale" type="number" min="1" max="4" step="0.1" value="2" /></label>
      <button id="auto-zoom">Auto zoom</button>
    </div>
    <canvas id="timeline" height="130"></canvas>
    <div id="status">Ready</div>
  </section>

  <aside id="panel">
    <h3>Local AI <span class="badge" title="Models run on this computer. Nothing is uploaded.">offline</span></h3>
    <div class="row"><button id="ai-transcribe" class="wide">Transcribe</button><button id="ai-models" title="Download or delete local models">Models...</button></div>
    <label><input type="checkbox" id="cap-burn" /> Burn in captions</label>
    <label>Caption size <input id="cap-size" type="range" min="0.025" max="0.08" step="0.002" /></label>
    <div class="row"><button id="cap-export" class="wide">Export SRT / VTT...</button></div>
    <div class="row"><button id="ai-autocut" class="wide">Auto cut</button></div>
    <label><input type="checkbox" id="cut-fillers" checked /> Filler words (um, uh)</label>
    <label><input type="checkbox" id="cut-silences" checked /> Pauses longer than <select id="cut-min"><option value="500">0.5 s</option><option value="700" selected>0.7 s</option><option value="1200">1.2 s</option></select></label>
    <div class="row"><button id="ai-redact" class="wide" title="Find emails, API keys, card and phone numbers on screen and blur them">Auto blur secrets</button></div>
    <div class="row"><button id="ai-docs" class="wide" title="Title, chapters, step by step guide and a social post">Write docs</button></div>
    <label><input type="checkbox" id="docs-llm" checked /> Use local LLM if available</label>
    <h3>Audio</h3>
    <label><input type="checkbox" id="aud-denoise" /> Remove background noise</label>
    <label><input type="checkbox" id="aud-mute" /> Mute</label>
    <progress id="ai-progress" max="1" value="0" hidden></progress>
    <h3>Background</h3>
    <select id="bg-type"><option value="gradient">Gradient</option><option value="solid">Solid</option><option value="image">Image</option></select>
    <div class="row"><input type="color" id="bg-from" value="#6366f1" /><input type="color" id="bg-to" value="#ec4899" /><input id="bg-angle" type="number" value="35" title="angle" /></div>
    <input id="bg-image" placeholder="/path/to/wallpaper.jpg" />
    <h3>Frame</h3>
    <label>Padding <input id="padding" type="range" min="0" max="0.3" step="0.005" /></label>
    <label>Corners <input id="radius" type="range" min="0" max="0.06" step="0.002" /></label>
    <label>Shadow <input id="shadow" type="range" min="0" max="0.1" step="0.002" /></label>
    <h3>Cursor</h3>
    <label><input type="checkbox" id="cur-visible" /> Show cursor</label>
    <label>Size <input id="cur-size" type="range" min="0.5" max="4" step="0.1" /></label>
    <label>Smoothing <input id="cur-smooth" type="range" min="0" max="300" step="10" /></label>
    <label><input type="checkbox" id="cur-ripple" /> Click ripples</label>
    <h3>Keys</h3>
    <label><input type="checkbox" id="keys-on" /> Keystroke overlay</label>
    <label><input type="checkbox" id="keys-short" /> Shortcuts only</label>
    <h3>Blur</h3>
    <div class="row"><input id="blur-rect" placeholder="x,y,w,h (source px)" /><button id="blur-add">Add</button></div>
    <div id="blur-list"></div>
    <h3>Preset</h3>
    <div class="row"><select id="preset-list"></select><button id="preset-apply">Apply</button></div>
    <div class="row"><input id="preset-name" placeholder="Product name" /><button id="preset-save">Save</button></div>
    <h3>Export</h3>
    <div class="row">
      <select id="ex-aspect"><option>16:9</option><option>9:16</option><option>1:1</option></select>
      <select id="ex-quality"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option><option value="2160">4K</option></select>
      <select id="ex-fps"><option>24</option><option selected>30</option><option>60</option></select>
    </div>
    <div class="row"><button id="ex-btn" class="primary wide">Export MP4 / GIF...</button></div>
    <progress id="ex-progress" max="1" value="0"></progress>
  </aside>
</main>
<dialog id="modal">
  <div class="modal-head"><strong id="modal-title"></strong><button id="modal-close">Close</button></div>
  <div id="modal-body"></div>
</dialog>
<script src="timeline.js"></script>
<script src="main.js"></script>
</body>
</html>
