[package]
name = "demolens-core"
description = "Event log, auto zoom, compositor and export pipeline for DemoLens"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Global keyboard/mouse hooks for the event log (needs X11/Xtst dev libs on Linux).
input-hooks = ["dep:rdev", "dep:x11"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rayon = "1"
png = "0.17"
ab_glyph = "0.2"
nnnoiseless = { version = "0.5", default-features = false }

# rdev's CGEventTap on macOS needs Accessibility permission and looks up key
# names off the main thread, which can hang or crash the app. macOS uses the
# permission free poller in input.rs instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = { version = "0.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib", "xinput"], optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The microphone and system audio loopback (Windows) are read in process
# through WASAPI, and the editor's sound is played to the output device on
# Windows and macOS, with no device names passed to another program.
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
# Window listing, screen size, DPI awareness and touch input go through the
# Win32 API directly, so nothing needs a PowerShell process.
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Storage_FileSystem",
] }

# macOS screen capture goes through ScreenCaptureKit. The old avfoundation
# screen input (AVCaptureScreenInput) is deprecated and delivers no frames on
# recent macOS releases. The crate builds a small Swift bridge, so the macOS
# build needs Xcode (the macos runners and any Mac with Xcode tools have it).
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }
