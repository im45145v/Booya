[package]
name = "demolens-core"
description = "Event log, auto zoom, compositor and export pipeline for DemoLens"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Global keyboard/mouse hooks for the event log (needs X11/Xtst dev libs on Linux).
input-hooks = ["dep:rdev", "dep:x11", "dep:windows-sys"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rayon = "1"
png = "0.17"
ab_glyph = "0.2"
nnnoiseless = { version = "0.5", default-features = false }

# rdev's CGEventTap on macOS needs Accessibility permission and looks up key
# names off the main thread, which can hang or crash the app. macOS uses the
# permission free poller in input.rs instead.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = { version = "0.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = { version = "2.21", features = ["xlib"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"], optional = true }
