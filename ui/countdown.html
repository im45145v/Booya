<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Booya countdown</title>
<style>
@font-face{font-family:"Geist";src:url("fonts/Geist-Variable.ttf") format("truetype");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url("fonts/GeistMono-Variable.ttf") format("truetype");font-weight:100 900}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Geist",-apple-system,"SF Pro Display",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.c{position:absolute;inset:10px;border-radius:50%;display:grid;place-items:center;background:rgba(17,17,16,.86);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 36px rgba(0,0,0,.4);cursor:pointer}
.n{font-family:"Geist Mono",ui-monospace,monospace;font-size:92px;font-weight:600;color:#EDEBE5;font-variant-numeric:tabular-nums;animation:pop 1s ease-out both}
.h{position:absolute;bottom:34px;font-size:11px;color:rgba(255,255,255,.6)}
@keyframes pop{0%{transform:scale(1.35);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.9}}
@media (prefers-reduced-motion:reduce){.n{animation:none}}
</style></head>
<body><div class="c" id="c" title="Click to cancel"><div class="n" id="n"></div><div class="h">Click to cancel</div></div>
<script>
const T = window.__TAURI__;
let n = parseInt(new URLSearchParams(location.search).get('n') || '3', 10);
const el = document.getElementById('n');
function tick() { if (n <= 0) { T.core.invoke('countdown_done'); return; } el.textContent = n; el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; n--; setTimeout(tick, 1000); }
tick();
// Ignore the tail of the double click that pressed Record.
const shownAt = performance.now();
document.getElementById('c').onclick = () => { if (performance.now() - shownAt > 800) T.core.invoke('cancel_countdown'); };
</script></body></html>
