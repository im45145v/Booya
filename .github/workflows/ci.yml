name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux deps
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev pkg-config ffmpeg cmake clang libclang-dev
      - name: Test the area picker snap geometry
        run: node tests/js/snap.test.js
      - name: Test the shortcut recorder
        run: node tests/js/shortcuts.test.js
      - name: Test caption editing
        run: node tests/js/captions-edit.test.js
      - name: Test core and AI
        run: cargo test -p demolens-core -p demolens-ai
      - name: Build CLI and app
        run: cargo build --workspace --release
      - name: Speed numbers (macOS, VideoToolbox)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          brew install ffmpeg
          target/release/demolens bench --seconds 8 | tee bench.txt
          target/release/demolens bench --seconds 8 --json > bench.json
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat bench.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo audit (RustSec advisories)
        # Fails on known vulnerabilities. Unmaintained and unsound warnings
        # from the GTK and zbus stacks are reported but do not fail the job.
        run: |
          cargo install cargo-audit --locked
          cargo audit
