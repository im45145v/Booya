[workspace]
resolver = "2"
members = ["crates/demolens-core", "crates/demolens-cli"]
default-members = ["crates/demolens-core", "crates/demolens-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Ashish Malla <im45145v@users.noreply.github.com>"]
repository = "https://github.com/im45145v/DemoLens"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
