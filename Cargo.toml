[workspace]
resolver = "2"
members = ["crates/demolens-core", "crates/demolens-ai", "crates/demolens-cli", "src-tauri"]
default-members = ["crates/demolens-core", "crates/demolens-ai", "crates/demolens-cli", "src-tauri"]

[workspace.package]
rust-version = "1.88"
version = "0.7.0"
edition = "2021"
license = "MIT"
authors = ["Ashish Malla <im45145v@users.noreply.github.com>"]
repository = "https://github.com/im45145v/Booya"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
