[package]
name = "demolens-cli"
description = "Command line front end for DemoLens"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "demolens"
path = "src/main.rs"

[features]
default = ["input-hooks"]
input-hooks = ["demolens-core/input-hooks"]

[dependencies]
demolens-core = { path = "../demolens-core" }
anyhow.workspace = true
serde_json.workspace = true
