name: Release
# Builds installers for every OS. Push a tag like v0.2.0 to publish them as a
# GitHub Release, or change this file or tauri.conf.json on main, or run it by hand (Actions > Release > Run workflow) to get
# the installers as build artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/workflows/release.yml", "src-tauri/tauri.conf.json", "scripts/fetch-ffmpeg.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev pkg-config cmake clang libclang-dev patchelf file
      - name: Fetch static ffmpeg to bundle
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh
      - name: Build installers
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --config tauri.bundle-ffmpeg.json
      - name: Check bundled ffmpeg runs
        shell: bash
        run: |
          b=target/release/bundle
          case "$RUNNER_OS" in
            macOS)
              app=$(find $b/macos -maxdepth 1 -name '*.app' | head -1)
              "$app/Contents/MacOS/demolens-ffmpeg" -hide_banner -version | head -1
              "$app/Contents/MacOS/demolens-ffprobe" -hide_banner -version | head -1 ;;
            Windows)
              # the installer puts the sidecars next to the app exe; run the staged copies
              ./target/release/demolens-ffmpeg.exe -hide_banner -version | head -1
              ./target/release/demolens-ffprobe.exe -hide_banner -version | head -1
              7z l $b/msi/*.msi | grep -i demolens-ff || true ;;
            Linux)
              deb=$(ls $b/deb/*.deb | head -1)
              mkdir -p /tmp/deb && dpkg-deb -x "$deb" /tmp/deb
              ls -la /tmp/deb/usr/bin
              /tmp/deb/usr/bin/demolens-ffmpeg -hide_banner -version | head -1
              /tmp/deb/usr/bin/demolens-ffprobe -hide_banner -version | head -1 ;;
          esac
      - name: Check macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          echo "App: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Signature|Identifier|Format|flags|TeamIdentifier'
          spctl -a -vvv -t exec "$app" || echo "spctl rejects ad-hoc signed apps without notarisation, as expected"
          dmg=$(find target/release/bundle/dmg -name '*.dmg' | head -1)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
          echo "Mounted $dmg at $mnt"
          codesign --verify --deep --strict --verbose=2 "$mnt"/*.app
          codesign -dv "$mnt"/*.app/Contents/MacOS/demolens-ffmpeg 2>&1 | grep -E 'Signature|Identifier'
          "$mnt"/*.app/Contents/MacOS/demolens-ffmpeg -hide_banner -version | head -1
          hdiutil detach "$mnt"
      - name: Check every macOS helper is signed the same way
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Gatekeeper and TCC treat each executable on its own, so the app,
          # ffmpeg and ffprobe must all carry the same ad-hoc signature with
          # the hardened runtime.
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          bad=0
          for f in "$app"/Contents/MacOS/*; do
            info=$(codesign -dv "$f" 2>&1)
            echo "== $f"; echo "$info" | grep -E 'Identifier|flags|Signature'
            echo "$info" | grep -q 'flags=.*runtime' || { echo "NOT hardened: $f"; bad=1; }
            echo "$info" | grep -q 'Signature=adhoc' || { echo "NOT ad-hoc signed: $f"; bad=1; }
          done
          exit $bad
      - name: Build CLI
        run: cargo build --release -p demolens-cli
      - name: macOS recording must not hang
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          plutil -p "$app/Contents/Info.plist" | grep -E 'UsageDescription'
          codesign -d --entitlements - "$app" 2>/dev/null | grep -E 'audio-input|camera' || codesign -d --entitlements :- "$app"
          export DEMOLENS_FFMPEG="$app/Contents/MacOS/demolens-ffmpeg" DEMOLENS_FFPROBE="$app/Contents/MacOS/demolens-ffprobe"
          "$DEMOLENS_FFMPEG" -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | head -20 || true
          # doctor must answer with JSON and exit, whatever the permission state.
          set +e
          perl -e 'alarm 60; exec @ARGV' ./target/release/demolens doctor --seconds 2
          echo "doctor exit code $?"
          set -e
          # The runner has no Screen Recording permission. The recorder must
          # either record or fail with a clear message, never hang.
          set +e
          start=$(date +%s)
          perl -e 'alarm 90; exec @ARGV' ./target/release/demolens record --mic --seconds 3 --out "$RUNNER_TEMP/rec"
          code=$?
          echo "exit code $code after $(( $(date +%s) - start )) s"
          ls -la "$RUNNER_TEMP/rec" || true
          if [ $code -eq 142 ]; then echo "recording hung"; exit 1; fi
          exit 0
      - name: Sign the macOS CLI
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --options runtime target/release/demolens
          codesign --verify --strict --verbose=2 target/release/demolens
      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist
          b=target/release/bundle
          find "$b" -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -exec cp {} dist/ \;
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/demolens-cli-${{ matrix.name }}.zip" ./target/release/demolens.exe
          else
            tar -czf "dist/demolens-cli-${{ matrix.name }}.tar.gz" -C target/release demolens
          fi
          ls -la dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demolens-${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          draft: false
          body_path: docs/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
