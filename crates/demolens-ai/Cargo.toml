[package]
name = "demolens-ai"
description = "Local, offline AI features for DemoLens: speech to text, OCR redaction, local LLM docs, model manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["whisper", "ocr"]
# Speech recognition with whisper.cpp (needs a C++ compiler and CMake).
whisper = ["dep:whisper-rs"]
# Text detection and recognition for auto blur (pure Rust).
ocr = ["dep:ocrs", "dep:rten"]

[dependencies]
demolens-core = { path = "../demolens-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
regex = "1"
sha2 = "0.10"
hmac = "0.12"
ureq = { version = "3", features = ["json"] }
whisper-rs = { version = "0.16", optional = true }
ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true }
