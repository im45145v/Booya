name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  # whisper.cpp otherwise builds with -march=native: a build made on one runner
  # CPU can crash (illegal instruction) on another CPU, and so can an installer.
  GGML_NATIVE: "OFF"
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: portable-ggml
      - name: Linux deps
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev pkg-config ffmpeg cmake clang libclang-dev
      - name: Test the area picker snap geometry
        run: node tests/js/snap.test.js
      - name: Test the shortcut recorder
        run: node tests/js/shortcuts.test.js
      - name: Test caption editing
        run: node tests/js/captions-edit.test.js
      - name: Test touch on the timeline
        run: node tests/js/timeline-touch.test.js
      - name: Test the editor preview clock
        run: node tests/js/avsync.test.js
      - name: Test the updater manifest builder
        run: python3 scripts/test_make_latest_json.py
      - name: ffmpeg for the media tests and the sync probe
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install ffmpeg; else choco install ffmpeg -y --no-progress; echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"; fi
          fi
          ffmpeg -version | head -1
      - name: Test core and AI
        run: cargo test -p demolens-core -p demolens-ai
      - name: Build CLI and app
        run: cargo build --workspace --release
      - name: Sound against picture, every stage that works on files
        shell: bash
        run: |
          set +e
          target/release/demolens syncprobe | tee sync.txt
          code=${PIPESTATUS[0]}
          { echo "### Sound vs picture on $RUNNER_OS"; echo; cat sync.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Windows screen clock (gdigrab, video only)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $flash = {
            Add-Type -AssemblyName System.Windows.Forms
            $f = New-Object System.Windows.Forms.Form
            $f.FormBorderStyle = 'None'; $f.WindowState = 'Maximized'; $f.TopMost = $true; $f.BackColor = 'Black'
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $t = New-Object System.Windows.Forms.Timer; $t.Interval = 10
            $t.Add_Tick({ $ms = $sw.ElapsedMilliseconds; if ($ms -ge 1000 -and ($ms % 1000) -lt 100) { $f.BackColor = 'White' } else { $f.BackColor = 'Black' }; if ($ms -gt 17000) { $f.Close() } })
            $t.Start(); [void]$f.ShowDialog()
          }
          $job = Start-Job -ScriptBlock $flash
          Start-Sleep -Seconds 2
          ffmpeg -v error -y -f gdigrab -framerate 30 -t 14 -i desktop -c:v libx264 -preset ultrafast gdi.mp4
          Stop-Job $job; Remove-Job $job -Force
          $r = & target/release/demolens.exe syncprobe --flashes gdi.mp4
          $code = $LASTEXITCODE
          "### Windows screen capture clock`n`n$r" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $r
          exit $code
      - name: Windows capture, doctor and export (real run)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$PWD\target\release\demolens.exe"
          # A folder name with spaces: every path the app builds must survive them.
          $dir = Join-Path $env:RUNNER_TEMP 'demo lens rec'
          New-Item -ItemType Directory -Force $dir | Out-Null

          # doctor: ffmpeg found, gdigrab capture works, touch and screen reported.
          $doc = & $exe doctor --no-ai --seconds 3
          $doc
          if ($LASTEXITCODE -ne 0) { throw "doctor failed" }
          $d = $doc | ConvertFrom-Json
          if (-not $d.ok) { throw "doctor says not ok" }
          if ($d.virtual_screen.width -le 0) { throw "no virtual screen size" }

          # The picker's list is native now: it must be quick and include the screen.
          $t = Measure-Command { $src = & $exe sources }
          $src
          if ($t.TotalSeconds -gt 20) { throw "listing sources took $($t.TotalSeconds) s" }
          if (-not ($src -match 'display|Entire')) { throw "the entire screen is not listed" }

          # Record the screen, then an area, with the real capture code.
          foreach ($case in @(@('screen', @()), @('area', @('--area', '0,0,640,480')))) {
            $out = Join-Path $dir $case[0]
            & $exe record --seconds 5 --out $out @($case[1])
            if ($LASTEXITCODE -ne 0) { throw "record $($case[0]) failed" }
            $video = Get-ChildItem $out -Filter 'recording.mp4' | Select-Object -First 1
            if (-not $video -or $video.Length -lt 10000) { throw "no video for $($case[0])" }
            $hdr = (Get-Content (Join-Path $out 'recording.events.jsonl') -TotalCount 1) | ConvertFrom-Json
            if ($hdr.width -le 0 -or $hdr.height -le 0) { throw "event log has no size for $($case[0])" }
            $proj = Join-Path $out 'project.json'
            & $exe new $video.FullName --events (Join-Path $out 'recording.events.jsonl') -o $proj
            if ($LASTEXITCODE -ne 0) { throw "new failed" }
            $final = Join-Path $out 'final.mp4'
            & $exe export $proj -o $final --quality 720
            if ($LASTEXITCODE -ne 0) { throw "export $($case[0]) failed" }
            $dur = [double](& ffprobe -v error -show_entries format=duration -of csv=p=0 $final)
            "$($case[0]): exported $([math]::Round($dur,1)) s, $((Get-Item $final).Length) bytes"
            if ($dur -lt 3) { throw "exported video is too short ($dur s)" }
          }

          # Nothing is left running: no ffmpeg from the capture or the export.
          Start-Sleep -Seconds 1
          $left = Get-Process -Name ffmpeg, ffprobe -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table; throw "ffmpeg or ffprobe is still running after the run" }
          "### Windows capture, doctor and export`n`nPassed: doctor, sources, screen and area capture, export, no leftover processes." | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Windows microphone pipeline (no device on the runner)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          # The runner has no microphone, or a virtual one. Either way the
          # pipeline has to finish and say what happened, never stay silent.
          $out = & "$PWD\target\release\demolens.exe" doctor --audio --seconds 2 | Out-String
          $code = $LASTEXITCODE
          $out
          $r = $out | ConvertFrom-Json
          if (-not $r.backend) { throw "doctor --audio did not say which backend it used" }
          if ($r.ok) { "A microphone recorded: peak $($r.peak_db) dBFS via $($r.backend)" }
          else {
            if ($code -ne 1) { throw "doctor --audio should exit 1 when the mic did not record" }
            if (-not "$($r.message)".StartsWith('Mic not recorded')) { throw "the failure was not explained: $($r.message)" }
            if (-not (Test-Path $r.log)) { throw "no audio.log was written" }
            "Surfaced as expected: $($r.message)"
          }
          Start-Sleep -Seconds 1
          if (Get-Process -Name ffmpeg -ErrorAction SilentlyContinue) { throw "ffmpeg is still running after the microphone check" }
          "### Windows microphone pipeline`n`n$($r.backend): $($r.message)$($r.peak_db)" | Out-File -Append $env:GITHUB_STEP_SUMMARY
      - name: Speed numbers (macOS, VideoToolbox)
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          brew install ffmpeg
          target/release/demolens bench --seconds 8 | tee bench.txt
          target/release/demolens bench --seconds 8 --json > bench.json
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat bench.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
  capture-sync:
    # Real capture on Linux: Xvfb + x11grab for the screen, a PulseAudio null
    # sink for the sound, through the same record and finish code the app uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: capture-sync-portable-ggml
      - name: Deps
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg xvfb x11-utils x11-xserver-utils pulseaudio pulseaudio-utils libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev pkg-config cmake clang libclang-dev
      - name: Build the CLI
        run: cargo build --release -p demolens-cli
      - name: Start a screen and a sound card
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2
          pulseaudio --start --exit-idle-time=-1 || true
          sleep 2
          pactl load-module module-null-sink sink_name=probe_sink
          pactl list short sinks
      - name: Record a flashing, beeping screen
        env:
          DISPLAY: ":99"
        run: |
          set +e
          target/release/demolens syncprobe --capture --seconds 20 | tee sync.txt
          code=${PIPESTATUS[0]}
          { echo "### Linux capture, sound vs picture"; echo; cat sync.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
  subtitles:
    # Real speech (espeak-ng) through the shipped CLI and a real whisper model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: subtitles-portable-ggml
      - name: Deps
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y ffmpeg espeak-ng libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libx11-dev libxtst-dev libxi-dev libdbus-1-dev pkg-config cmake clang libclang-dev
      - name: Build the CLI
        run: cargo build --release -p demolens-cli
      - name: Subtitles on real speech
        shell: bash
        run: python3 scripts/subtitles_e2e.py target/release/demolens "$RUNNER_TEMP/subs" | tee subs.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Subtitles on real speech'; echo '```'; tail -40 subs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  editor-e2e:
    # The real editor UI in Chrome (with AAC): the preview sound plays and is
    # not muted, and the editor screens render. Screenshots are kept.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: editor-e2e-portable-ggml
      - name: Deps
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y ffmpeg espeak-ng
          python3 -m pip install playwright pillow
          google-chrome --version
      - name: Build the test recording
        run: cargo run -q -p demolens-core --example e2e_fixture -- "$RUNNER_TEMP/fx" speech
      - name: The editor can be heard
        run: python3 tests/e2e/test_audio.py "$RUNNER_TEMP/fx"
      - name: Window sizes and splitters
        run: python3 tests/e2e/test_layout.py "$RUNNER_TEMP/fx" "$RUNNER_TEMP/shots"
      - name: Layout lane and controls
        run: python3 tests/e2e/test_scenes.py "$RUNNER_TEMP/fx" "$RUNNER_TEMP/shots"
      - name: Layouts in the real renderer and exporter
        run: |
          cargo run -q -p demolens-core --release --example layouts_gallery -- "$RUNNER_TEMP/gal"
          python3 tests/e2e/check_gallery.py "$RUNNER_TEMP/gal"
          mkdir -p "$RUNNER_TEMP/shots/layouts" && cp "$RUNNER_TEMP/gal/shots/"*.png "$RUNNER_TEMP/shots/layouts/"
      - name: Screenshots of the editor
        run: python3 tests/e2e/shots.py "$RUNNER_TEMP/fx" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editor-screenshots
          path: ${{ runner.temp }}/shots
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: cargo audit (RustSec advisories)
        # Fails on known vulnerabilities. Unmaintained and unsound warnings
        # from the GTK and zbus stacks are reported but do not fail the job.
        run: |
          cargo install cargo-audit --locked
          cargo audit
