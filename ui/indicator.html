<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DemoLens is recording</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="indicator">
  <div class="ind" role="status" aria-live="polite">
    <span class="ind-dot" id="dot"></span>
    <span id="label">REC</span>
    <span id="time">0:00</span>
    <button id="pause" title="Pause input capture (Ctrl/Cmd+Shift+P)">Pause</button>
  </div>
<script src="indicator.js"></script>
</body>
</html>
