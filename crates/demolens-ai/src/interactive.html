<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="DemoLens">
<title>{{TITLE}}</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--line:#2a2f3d;--text:#eef0f6;--dim:#9aa1b5;--accent:#7c83ff;--accent2:#ec4899;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100%;max-width:1440px;margin:0 auto;padding:16px;gap:16px}
header{display:flex;align-items:center;gap:16px;min-height:32px}
header h1{font-size:16px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums}
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;max-width:100%;max-height:100%;border-radius:var(--r);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5);border:1px solid var(--line);background:#000}
.stage img{display:block;max-width:100%;max-height:100%;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:0;border-radius:50%;background:rgba(124,131,255,.25);cursor:pointer;padding:0}
.hot::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff}
.hot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:pulse 1.6s ease-out infinite}
.hot:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}
.nudge{animation:nudge .35s}
@keyframes nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tip{position:absolute;width:min(320px,70%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 16px 40px rgba(0,0,0,.45);animation:in .25s}
.tip b{display:block;font-size:16px;margin-bottom:4px}
.tip span{display:block;color:var(--dim);font-size:14px}
.tip .nx{margin-top:12px;display:inline-block;background:var(--accent);border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 16px}
.btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);font-weight:600}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dots{flex:1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.done{background:var(--accent)}
.dot.cur{background:#fff;transform:scale(1.4)}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:32px;background:radial-gradient(1200px 600px at 50% 0,#252a46,var(--bg));z-index:5}
.card h2{font-size:32px;line-height:1.2;margin:0;max-width:720px}
.card p{margin:0;color:var(--dim);max-width:560px}
.card .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card[hidden]{display:none}
.badge{position:absolute;bottom:16px;color:var(--dim);font-size:12px}
.sr{position:absolute;left:-9999px}
@media (max-width:640px){.app{padding:8px;gap:8px}.bar{padding:8px;gap:8px}.btn{padding:8px 12px}.card h2{font-size:24px}.tip{width:86%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header><h1 id="ttl"></h1><span class="count" id="cnt"></span></header>
  <div class="stage-wrap"><div class="stage" id="stage"></div></div>
  <div class="bar">
    <button class="btn" id="back" title="Previous step (Left arrow)">Back</button>
    <div class="dots" id="dots" role="tablist" aria-label="Steps"></div>
    <button class="btn" id="play" title="Play the tour automatically">Play tour</button>
    <button class="btn pri" id="next" title="Next step (Right arrow)">Next</button>
  </div>
  <div class="card" id="start"><h2 id="st-t"></h2><p id="st-s"></p><div class="row"><button class="btn pri" id="go">Start the tour</button></div><div class="badge" id="b1"></div></div>
  <div class="card" id="end" hidden><h2>That is the whole tour</h2><p id="en-s"></p><div class="row"><a class="btn pri" id="cta" hidden target="_blank" rel="noopener noreferrer"></a><button class="btn" id="again">Watch again</button></div><div class="badge" id="b2"></div></div>
  <div class="sr" aria-live="polite" id="live"></div>
</div>
<script id="data" type="application/json">{{DATA}}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var S=D.steps,i=0,timer=null;
var $=function(id){return document.getElementById(id)};
$('ttl').textContent=D.title;$('st-t').textContent=D.title;$('st-s').textContent=D.summary+' '+S.length+' steps. Click the pulsing dot, or press the right arrow.';
$('en-s').textContent=D.title;
if(D.badge){$('b1').textContent=$('b2').textContent='Made with DemoLens, free and open source'}
if(D.cta_url&&D.cta_text){var c=$('cta');c.textContent=D.cta_text;c.href=D.cta_url;c.hidden=false}
var dots=$('dots');
S.forEach(function(s,k){var d=document.createElement('button');d.className='dot';d.title=(k+1)+'. '+s.title;d.setAttribute('aria-label','Go to step '+(k+1)+': '+s.title);d.onclick=function(){stop();show(k)};dots.appendChild(d)});
function tipPos(tip,s){
  var x=s.x==null?0.5:s.x,y=s.y==null?0.5:s.y;
  tip.style.top=s.y==null?'auto':'';tip.style.bottom=s.y==null?'16px':'';
  if(s.y==null){tip.style.left='16px';return}
  var right=x<0.5;
  tip.style.left=right?'calc('+(x*100)+'% + 40px)':'auto';
  tip.style.right=right?'auto':'calc('+((1-x)*100)+'% + 40px)';
  var below=y<0.6;
  tip.style.top=below?'calc('+(y*100)+'% - 24px)':'auto';
  tip.style.bottom=below?'auto':'calc('+((1-y)*100)+'% - 24px)';
}
function show(k){
  i=Math.max(0,Math.min(S.length-1,k));var s=S[i];
  var st=$('stage');st.innerHTML='';
  var im=new Image();im.src=s.image;im.alt=s.title;im.draggable=false;st.appendChild(im);
  if(s.x!=null){
    var h=document.createElement('button');h.className='hot';h.style.left=(s.x*100)+'%';h.style.top=(s.y*100)+'%';h.setAttribute('aria-label','Click here: '+s.title);
    h.onclick=function(e){e.stopPropagation();advance()};st.appendChild(h);
    im.onclick=function(){h.classList.remove('nudge');void h.offsetWidth;h.classList.add('nudge')};
  }
  var tip=document.createElement('div');tip.className='tip';
  var b=document.createElement('b');b.textContent=s.title;tip.appendChild(b);
  if(s.text){var t=document.createElement('span');t.textContent=s.text;tip.appendChild(t)}
  if(s.x==null){var n=document.createElement('button');n.className='nx';n.textContent=i==S.length-1?'Finish':'Next';n.onclick=advance;tip.appendChild(n)}
  st.appendChild(tip);tipPos(tip,s);
  $('cnt').textContent='Step '+(i+1)+' of '+S.length;
  $('back').disabled=i==0;
  $('next').textContent=i==S.length-1?'Finish':'Next';
  Array.prototype.forEach.call(dots.children,function(d,k){d.className='dot'+(k<i?' done':'')+(k==i?' cur':'')});
  $('live').textContent='Step '+(i+1)+' of '+S.length+': '+s.title+'. '+(s.text||'');
  var nx=S[i+1];if(nx){(new Image()).src=nx.image}
}
function advance(){if(i>=S.length-1){stop();$('end').hidden=false;$('cta').hidden||$('cta').focus();return}show(i+1)}
function stop(){if(timer){clearInterval(timer);timer=null;$('play').textContent='Play tour'}}
function begin(k){$('start').hidden=true;$('end').hidden=true;show(k||0);$('next').focus()}
$('go').onclick=function(){begin(0)};
$('again').onclick=function(){begin(0)};
$('next').onclick=function(){stop();advance()};
$('back').onclick=function(){stop();show(i-1)};
$('play').onclick=function(){if(timer){stop();return}$('play').textContent='Pause';timer=setInterval(function(){if(i>=S.length-1){advance()}else{show(i+1)}},3200)};
document.addEventListener('keydown',function(e){
  if($('start').hidden===false){if(e.key=='Enter'||e.key==' '){e.preventDefault();begin(0)}return}
  if(e.key=='ArrowRight'||e.key=='PageDown'){e.preventDefault();stop();advance()}
  else if(e.key=='ArrowLeft'||e.key=='PageUp'){e.preventDefault();stop();show(i-1)}
  else if(e.key=='Home'){stop();show(0)}else if(e.key=='End'){stop();show(S.length-1)}
  else if(e.key=='Escape'){stop();$('start').hidden=false}
});
show(0);$('start').hidden=false;$('go').focus();
})();
</script>
</body>
</html>
